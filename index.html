<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>STL Model Viewer</title>
  <style>
    /* Full-screen white canvas */
    body {
      margin: 0;
      background-color: #ffffff;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <!-- Three.js + Loaders as ES modules -->
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.154.0/build/three.module.js';
    import { STLLoader } from 'https://unpkg.com/three@0.154.0/examples/jsm/loaders/STLLoader.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.154.0/examples/jsm/controls/OrbitControls.js';

    // 1) Scene, Camera, Renderer
    const scene    = new THREE.Scene();
    const camera   = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.01, 1000 );
    camera.position.set( 0, 0.2, 0.5 );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize( window.innerWidth, window.innerHeight );
    document.body.appendChild( renderer.domElement );

    // 2) Lights
    const hemiLight = new THREE.HemisphereLight( 0xffffff, 0x444444, 1.2 );
    hemiLight.position.set( 0, 20, 0 );
    scene.add( hemiLight );

    const dirLight = new THREE.DirectionalLight( 0xffffff, 0.8 );
    dirLight.position.set( 5, 10, 7.5 );
    scene.add( dirLight );

    // 3) Load the STL
    const loader = new STLLoader();
    loader.load(
      'model.stl',                // <-- your STL filename / path
      geometry => {
        // Ensure normals are computed (in case STL lacks them)
        geometry.computeVertexNormals();

        // Center the geometry
        geometry.center();

        // Create mesh with a simple gray metal look
        const material = new THREE.MeshStandardMaterial({
          color: 0x777777,
          metalness: 0.3,
          roughness: 0.6
        });
        const mesh = new THREE.Mesh( geometry, material );

        // Optionally scale it (1.0 is as-exported units)
        // mesh.scale.setScalar(1.0);

        scene.add( mesh );
      },
      xhr => {
        console.log( `Loading: ${ (xhr.loaded / xhr.total * 100).toFixed(1) }%` );
      },
      error => {
        console.error( 'Error loading STL:', error );
      }
    );

    // 4) Orbit controls
    const controls = new OrbitControls( camera, renderer.domElement );
    controls.enableDamping = true;
    controls.dampingFactor  = 0.05;

    // 5) Render loop
    function animate() {
      requestAnimationFrame( animate );
      controls.update();
      renderer.render( scene, camera );
    }
    animate();

    // 6) Handle resizing
    window.addEventListener( 'resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize( window.innerWidth, window.innerHeight );
    });
  </script>
</body>
</html>
