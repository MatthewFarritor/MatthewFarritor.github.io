<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>STL Model Viewer</title>
  <style>
    /* make the canvas fill the window and page white */
    body { margin: 0; background: #fff; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
    <body>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.154.0/build/three.module.js';
    import { STLLoader } from 'https://unpkg.com/three@0.154.0/examples/jsm/loaders/STLLoader.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.154.0/examples/jsm/controls/OrbitControls.js';

    // Scene + Camera + Renderer
    const scene    = new THREE.Scene();
    const camera   = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 1000 );
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize( window.innerWidth, window.innerHeight );
    document.body.appendChild( renderer.domElement );

    // Lights
    const hemiLight = new THREE.HemisphereLight( 0xffffff, 0x444444, 1.2 );
    hemiLight.position.set( 0, 20, 0 );
    scene.add( hemiLight );

    const dirLight = new THREE.DirectionalLight( 0xffffff, 0.8 );
    dirLight.position.set( 5, 10, 7.5 );
    scene.add( dirLight );

    // Load STL
    const loader = new STLLoader();
    loader.load(
      'model.stl',           // Path to your STL file
      geometry => {
        // Create a material and mesh from the loaded geometry
        const material = new THREE.MeshStandardMaterial({ color: 0x777777, metalness: 0.3, roughness: 0.6 });
        const mesh     = new THREE.Mesh( geometry, material );

        // Center geometry and scale (optional)
        geometry.center();
        const scale = 0.01; // adjust based on your model units
        mesh.scale.setScalar(scale);

        scene.add( mesh );
      },
      xhr => {
        // optional progress callback
        console.log( `STL ${ (xhr.loaded / xhr.total * 100).toFixed(1) }% loaded` );
      },
      err => console.error( 'Error loading STL:', err )
    );

    // Controls
    const controls = new OrbitControls( camera, renderer.domElement );
    controls.enableDamping = true;

    // Initial camera position
    camera.position.set( 0, 0.1, 0.3 );
    controls.update();

    // Handle window resize
    window.addEventListener( 'resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize( window.innerWidth, window.innerHeight );
    });

    // Render loop
    function animate() {
      requestAnimationFrame( animate );
      controls.update();
      renderer.render( scene, camera );
    }
    animate();
  </script>
</body>
</html>
